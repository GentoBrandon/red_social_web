services:
  postgres:
    image: postgres:17-bookworm
    container_name: db_pg2
    environment:
      POSTGRES_USER: 'admin'
      POSTGRES_PASSWORD: '12345'
      POSTGRES_DB: 'social_database'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d social_database']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend   # Ruta para el backend
      dockerfile: Dockerfile
      target: development
    container_name: backend_app
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://admin:12345@postgres:5432/social_database
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/social_network  # Ruta para el frontend
      dockerfile: Dockerfile
      target: development
    container_name: frontend_app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/social_network:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

volumes:
  postgres_data:
